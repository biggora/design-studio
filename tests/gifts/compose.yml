services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: gifts-test
      POSTGRES_DB: gifts_test
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./roles.sql:/docker-entrypoint-initdb.d/000-roles.sql:ro
      - ../../init/postgres_tables.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./grants.sql:/docker-entrypoint-initdb.d/002-grants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gifts_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: gifts-test
      MYSQL_DATABASE: gifts_test
    ports: ["127.0.0.1:${GIFTS_MYSQL_PORT:-33331}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../init/mysql_tables.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pgifts-test --silent"]
      interval: 2s
      timeout: 3s
      retries: 45
  postgrest:
    build: .
    environment:
      PGRST_DB_URI: postgres://postgres:gifts-test@postgres:5432/gifts_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-gifts-only-secret-at-least-32-characters
      PGRST_ADMIN_SERVER_PORT: 3001
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${GIFTS_API_PORT:-33330}:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      postgrest: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/rest/v1/"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  mysql-data:
