services:
  postgres:
    image: postgres:17
    container_name: design-studio-listings-postgres
    environment:
      POSTGRES_PASSWORD: listings-test
      POSTGRES_DB: listings_test
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listings_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    container_name: design-studio-listings-mysql
    environment:
      MYSQL_ROOT_PASSWORD: listings-test
      MYSQL_DATABASE: listings_test
    ports: ["127.0.0.1:${LISTINGS_MYSQL_PORT:-33316}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -plistings-test --silent"]
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  postgres-data:
  mysql-data:
